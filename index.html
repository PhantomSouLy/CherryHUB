<!DOCTYPE html>
<html lang="hu" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#15061f" />
  <title>CherryHUB</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="petal-noise" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#home" aria-label="CherryHUB főoldal">
      <span class="brand-icon">✿</span>
      <span>CherryHUB</span>
    </a>

    <div class="top-actions">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Téma váltása">☾</button>
      <button class="menu-toggle" type="button" aria-label="Menü megnyitása">☰</button>
      <a class="contact-btn" href="#links">Kapcsolat</a>
    </div>

    <nav class="nav" id="mainNav" aria-label="Fő navigáció"></nav>
  </header>

  <main id="home" class="hero">
    <section class="hero-copy">
      <p class="eyebrow">Üdv a</p>
      <h1>CherryHUB<span>✿</span></h1>
      <p class="lead" id="heroLead">Minden fontos infó Cherry streamjeiről egy helyen.</p>
      <div class="hero-actions" id="heroActions"></div>
      <p class="thanks">❤ Köszönöm, hogy részese vagy a közösségnek! 🐰</p>
    </section>

    <section class="flower-wrap" aria-label="CherryHUB virág menü">
      <div class="flower" id="flowerMenu"></div>
    </section>

    <aside class="info-card" id="floatingCard" aria-live="polite">
      <button class="close-card" type="button" aria-label="Információs kártya elrejtése">×</button>
      <div class="card-kicker">✿ Stream</div>
      <h2>Betöltés...</h2>
      <p>Kis türelmet.</p>
      <ul></ul>
      <a class="card-link" href="#stream">Részletek megnyitása →</a>
    </aside>
  </main>

  <section class="social-strip" id="socialStrip" aria-label="Közösségi linkek"></section>
  <section class="news-strip" id="newsStrip" aria-label="Gyors hírek"></section>
  <section class="cards" id="cardsGrid" aria-label="CherryHUB témák"></section>
  <section class="wide-sections" id="wideSections" aria-label="Kiemelt szekciók"></section>
  <section id="links" class="links"></section>

  <footer>© 2026 CherryHUB • Készült szeretettel Cherry közösségének 💕</footer>

  <div class="modal" id="infoModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-panel">
      <button class="modal-close" type="button" data-close-modal aria-label="Ablak bezárása">×</button>
      <div class="modal-kicker" id="modalKicker"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-actions" id="modalActions"></div>
    </article>
  </div>
</body>
</html>
